# Garde-fou avant le deploiement Northflank.
#
# Northflank reconstruit et redeploie l'API a chaque push sur `main` via son
# integration Git : c'est lui qui deploie, pas ce workflow. Ce workflow verifie
# que le code compile et que l'image Docker se construit, pour que l'echec
# apparaisse dans la pull request plutot qu'en production.
name: Backend — CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  compilation:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Genere le client Prisma : sans lui, `nest build` echoue sur les types.
      - run: npx prisma generate

      # Verifie la coherence du schema sans toucher a une base.
      - run: npx prisma validate

      - run: npm run build

      - name: Tests unitaires
        run: npm test --if-present

  image-docker:
    name: Construction de l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construit exactement ce que Northflank construira. On ne pousse nulle
      # part : le but est de detecter une image cassee avant le deploiement.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
