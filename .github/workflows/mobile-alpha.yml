# Construit l'Android App Bundle et le publie sur le canal alpha du Play Store.
#
# Declenche a chaque push sur `main` touchant `mobile/`, et manuellement depuis
# l'onglet Actions. EAS incremente le `versionCode` tout seul
# (`autoIncrement` + `appVersionSource: remote` dans eas.json) : aucun numero
# de version a gerer a la main.
#
# Pre-requis, decrits dans docs/CI-CD.md :
#   - secret EXPO_TOKEN                      (jeton de compte Expo) : active le build
#   - secret GOOGLE_PLAY_SERVICE_ACCOUNT     (JSON du compte de service, en clair) :
#     active en plus l'envoi sur le Play Store
#   - une premiere compilation faite a la main (`eas build`) pour creer la cle de
#     signature, puis une premiere version publiee a la main dans le Play Console
name: Mobile — publication alpha

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-alpha.yml'
  workflow_dispatch:

# Deux publications simultanees se marcheraient sur les pieds cote Play Store.
concurrency:
  group: mobile-alpha
  cancel-in-progress: false

jobs:
  # GitHub interdit le contexte `secrets` dans la condition `if` d'un job : le
  # fichier etait rejete en entier et echouait a chaque push. On lit donc les
  # secrets dans une etape, puis le job `alpha` teste la sortie de ce job.
  verifier:
    name: Verifier les secrets
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.secrets.outputs.build }}
      submit: ${{ steps.secrets.outputs.submit }}
    steps:
      - id: secrets
        env:
          EXPO: ${{ secrets.EXPO_TOKEN }}
          PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          build=false
          submit=false
          [ -n "$EXPO" ] && build=true
          [ -n "$EXPO" ] && [ -n "$PLAY" ] && submit=true
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "submit=$submit" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "Secret EXPO_TOKEN absent : build mobile ignore."
          [ "$submit" = true ] || echo "Secret GOOGLE_PLAY_SERVICE_ACCOUNT absent : pas d'envoi sur le Play Store."

  alpha:
    name: Build Android et envoi sur le canal alpha
    # Le build ne demande que EXPO_TOKEN ; l'envoi sur le Play Store demande en
    # plus GOOGLE_PLAY_SERVICE_ACCOUNT. Sans EXPO_TOKEN, le job est volontairement
    # ignore plutot que mis en echec : inutile de polluer l'historique des
    # executions avec des runs rouges previsibles.
    needs: verifier
    if: ${{ needs.verifier.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Verification des types
        run: npm run typecheck

      # Le JSON du compte de service ne doit jamais etre dans le depot : il est
      # ecrit depuis le secret, le temps du job, a l'endroit ou eas.json
      # l'attend (serviceAccountKeyPath).
      - name: Deposer la cle du compte de service Google Play
        if: ${{ needs.verifier.outputs.submit == 'true' }}
        env:
          KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret GOOGLE_PLAY_SERVICE_ACCOUNT est vide." && exit 1
          fi
          printf '%s' "$KEY" > google-play-service-account.json
          node -e "JSON.parse(require('fs').readFileSync('google-play-service-account.json','utf8'))" \
            || { echo "::error::Le secret n'est pas un JSON valide."; exit 1; }

      # --wait : le job ne rend la main qu'une fois le bundle construit, pour
      # que l'etape d'envoi trouve bien un artefact.
      - name: Construire l'App Bundle
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Publier sur le canal alpha
        if: ${{ needs.verifier.outputs.submit == 'true' }}
        run: eas submit --platform android --profile production --non-interactive --latest

      # Le fichier disparait avec la machine virtuelle, mais on ne compte pas
      # sur ce detail : il est efface explicitement, meme si une etape a echoue.
      - name: Effacer la cle
        if: ${{ always() && needs.verifier.outputs.submit == 'true' }}
        run: rm -f google-play-service-account.json

      # Sans la cle Google Play, le bundle est construit mais n'arrive jamais sur le
      # Play Store : un run vert laissait croire que la version etait publiee. Le job
      # echoue donc ici, apres le build, pour que le .aab reste disponible a l'envoi
      # manuel depuis EAS.
      - name: Exiger l'envoi sur le Play Store
        if: ${{ needs.verifier.outputs.submit != 'true' }}
        run: |
          {
            echo "## Version construite, mais NON publiee sur le Play Store"
            echo ""
            echo "Le secret \`GOOGLE_PLAY_SERVICE_ACCOUNT\` est absent : l'App Bundle a ete construit sur EAS"
            echo "mais n'a pas ete envoye sur le canal alpha. Les telephones des testeurs ne recevront rien."
            echo ""
            echo "- Envoi manuel : telecharger le .aab depuis EAS (lien dans l'etape « Construire l'App Bundle »),"
            echo "  puis Play Console > Tests > Test ferme (alpha) > Creer une version."
            echo "- Envoi automatique : ajouter le JSON du compte de service Google Play dans le secret"
            echo "  \`GOOGLE_PLAY_SERVICE_ACCOUNT\` (voir docs/CI-CD.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Play Store non publie::Secret GOOGLE_PLAY_SERVICE_ACCOUNT absent : le bundle est construit sur EAS mais n'a pas ete envoye sur le canal alpha."
          exit 1
