# Deploie le site web (Next.js) sur Cloudflare Workers a chaque push sur `main`
# qui touche `frontend/`. Meme commande que le deploiement manuel : `npm run cf:deploy`.
#
# A renseigner une fois dans GitHub (Settings > Secrets and variables > Actions) :
#   Secret   CLOUDFLARE_API_TOKEN   jeton Cloudflare, modele "Edit Cloudflare Workers"
#   Secret   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
#   Variable API_ORIGIN             adresse de l'API sans /api, ex. https://api.exemple.org
name: Frontend — Deploiement Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# Un deploiement en cours n'est jamais interrompu par un suivant.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  deploiement:
    name: Build et deploiement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build et publication
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_ORIGIN: ${{ vars.API_ORIGIN }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_ORIGIN }}/api
