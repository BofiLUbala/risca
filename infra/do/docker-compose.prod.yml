# Pile de production RISAC sur un droplet DigitalOcean.
#
# Disposition sur le serveur (voir infra/do/deploy.sh) :
#   /opt/risac/docker-compose.yml   <- ce fichier
#   /opt/risac/Caddyfile
#   /opt/risac/.env                 <- secrets, genere sur le serveur, jamais dans le depot
#   /opt/risac/src/backend/         <- code de l'API, envoye par deploy.sh
#
# Seul Caddy publie des ports (80/443). Postgres et l'API restent sur le reseau
# interne de Docker : rien d'autre n'est joignable depuis Internet.
name: risac

services:
  postgres:
    image: postgres:16-alpine
    container_name: risac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: risac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: risac
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risac -d risac"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: risac-api:latest
    container_name: risac-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      UPLOAD_DIR: ./uploads
      DATABASE_URL: postgresql://risac:${POSTGRES_PASSWORD}@postgres:5432/risac?schema=public
    volumes:
      # Les fichiers televerses survivent aux redeploiements.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      # `prisma db push` s'execute avant node : laisser le temps au premier demarrage.
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: risac-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
