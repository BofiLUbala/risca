# Blueprint Render — API RISAC.
#
# Render > New > Blueprint > selectionner ce depot. Render cree alors le
# service web ET la base Postgres declaree en fin de fichier, et relie les
# deux tout seul.
#
# Les variables marquees `sync: false` restent a saisir dans le tableau de
# bord : ce sont des secrets, ils n'ont rien a faire dans le depot.
services:
  - type: web
    name: risac-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render impose le port d'ecoute via PORT ; main.ts le lit deja.
      - key: PORT
        value: 10000

      # ─── Base de donnees ───
      # Render cable lui-meme la chaine de connexion de la base declaree plus
      # bas : rien a saisir dans le tableau de bord, et aucun identifiant ne
      # transite par le depot.
      - key: DATABASE_URL
        fromDatabase:
          name: risac-db
          property: connectionString

      # ─── Secrets JWT : generes par Render, jamais committes ───
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # ─── URL du front (liens dans les e-mails et les notifications) ───
      - key: APP_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # ─── Regles metier ───
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PLATFORM_FEE_PERCENT
        value: 5
      - key: PROJECT_APPROVAL_THRESHOLD_USD
        value: 1000
      - key: VALIDATION_ESCALATION_HOURS
        value: 72

      # ─── E-mails (codes OTP d'activation) ───
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # ─── Notifications push (Firebase Cloud Messaging) ───
      # Sans ces trois variables, la plateforme tourne normalement mais
      # n'envoie aucun push ; tout reste consultable dans l'application.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

# ─── Base de donnees managee ───
# Le plan gratuit de Render expire apres 30 jours : passer la base en plan
# payant avant l'echeance, ou exporter les donnees. Sans quoi l'API perd sa
# base et ne redemarre plus.
databases:
  - name: risac-db
    plan: free
    region: frankfurt
    databaseName: risac
    user: risac
