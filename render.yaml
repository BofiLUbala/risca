# Blueprint Render — API RISAC.
#
# Render > New > Blueprint > selectionner ce depot. Render cree alors le
# service web ET la base Postgres declaree en fin de fichier, et relie les
# deux tout seul.
#
# Les variables marquees `sync: false` restent a saisir dans le tableau de
# bord : ce sont des secrets, ils n'ont rien a faire dans le depot.
services:
  - type: web
    name: risac-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render impose le port d'ecoute via PORT ; main.ts le lit deja.
      - key: PORT
        value: 10000

      # ─── Base de donnees ───
      # Render cable lui-meme la chaine de connexion de la base declaree plus
      # bas : rien a saisir dans le tableau de bord, et aucun identifiant ne
      # transite par le depot.
      - key: DATABASE_URL
        fromDatabase:
          name: risac-db
          property: connectionString

      # ─── Secrets JWT : generes par Render, jamais committes ───
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # ─── URL du front (liens dans les e-mails et les notifications) ───
      # Service risac-web declare plus bas. Ce ne sont pas des secrets.
      - key: APP_WEB_URL
        value: https://risac-web.onrender.com
      - key: CORS_ORIGINS
        value: https://risac-web.onrender.com

      # ─── Creation du compte Super Admin sur /admin ───
      # Valeur aleatoire generee par Render (onglet Environment du service) :
      # elle est demandee une seule fois, a la creation de l'unique Super Admin,
      # et empeche un inconnu de creer ce compte avant vous.
      - key: ADMIN_SETUP_KEY
        generateValue: true

      # ─── Regles metier ───
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PLATFORM_FEE_PERCENT
        value: 5
      - key: PROJECT_APPROVAL_THRESHOLD_USD
        value: 1000
      - key: VALIDATION_ESCALATION_HOURS
        value: 72

      # ─── E-mails (codes OTP d'activation) ───
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # ─── Notifications push (Firebase Cloud Messaging) ───
      # Sans ces trois variables, la plateforme tourne normalement mais
      # n'envoie aucun push ; tout reste consultable dans l'application.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # ─── Application web (Next.js) ───
  # Les variables NEXT_PUBLIC_* sont figees au moment du build : apres les avoir
  # modifiees, relancer un deploiement (Manual Deploy > Clear build cache & deploy).
  - type: web
    name: risac-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        value: https://risac-api.onrender.com/api
      - key: NEXT_PUBLIC_API_ORIGIN
        value: https://risac-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://risac-api.onrender.com
      # Configuration web Firebase (notifications). Sans elle, l'ecran
      # d'activation des notifications laisse passer tout le monde.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_VAPID_KEY
        sync: false

# ─── Base de donnees managee ───
# Le plan gratuit de Render expire apres 30 jours : passer la base en plan
# payant avant l'echeance, ou exporter les donnees. Sans quoi l'API perd sa
# base et ne redemarre plus.
databases:
  - name: risac-db
    plan: free
    region: frankfurt
    databaseName: risac
    user: risac
